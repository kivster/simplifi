      selector:
        text: {}
    kind:
      selector:
        select:
          options: [changes, sync]
    change_id:
      description: Optional retained household change ID. With kind sync, returns only attempts for that saved revision, plus the latest retained result. Does not relabel the original attempt or prove client enforcement.
