preview_recovery:
  name: Inspect gateway recovery
  description: Administrator-only complete controller read and recorded operation evidence. Does not write a policy.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    operation_id:
      selector:
        text: {}
resolve_operation:
  name: Record reviewed gateway recovery
  description: Administrator-only evidence-bound resolution. Use the dashboard recovery review first. Names alone do not establish ownership.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    operation_id:
      required: true
      selector:
        text: {}
    preview_hash:
      required: true
      selector:
        text: {}
    decision:
      required: true
      selector:
        select:
          options: [attach, confirm_absent, confirm_not_applied]
    confirm:
      required: true
      selector:
        boolean: {}
    request_finished:
      description: Required for confirm_absent and confirm_not_applied. Independently confirm the original UniFi request ended without the requested change; an absent or unchanged policy read is not proof.
      selector:
        boolean: {}
    reason:
      selector:
        text: {}
    expected_revision:
      selector:
        number:
          min: 0
          mode: box
    request_id:
      selector:
        text: {}

access_status:
  name: Read scoped family status
  description: Authenticated account with an active explicit grant. Returns only its
    permitted household scope.
  fields:
    entry_id:
      selector:
        text: {}
      required: true
access_users:
  name: List eligible access accounts
  description: Administrator-only list of existing active non-administrator Home Assistant
    accounts.
  fields:
    entry_id:
      selector:
        text: {}
      required: true
list_access_grants:
  name: List SimpliFi access grants
  description: Administrator-only permission review with access revision.
  fields:
    entry_id:
      selector:
        text: {}
      required: true
set_access_grant:
  name: Save scoped SimpliFi access
  description: Administrator only. Review role, explicit groups/networks and optional
    expiry in Activity → Manage access. Does not restrict ordinary Home Assistant
    account permissions.
  fields:
    entry_id:
      selector:
        text: {}
      required: true
    user_id:
      selector:
        text: {}
      required: true
    scope:
      selector:
        select:
          options:
          - read_only
          - agent_controls
          - watch_rules
      required: true
    groups:
      selector:
        object: {}
    networks:
      selector:
        object: {}
    all_groups:
      selector:
        boolean: {}
      description: Includes all current and future groups. Networks remain explicitly
        listed.
    expires_at:
      selector:
        text: {}
      description: Optional ISO 8601 deadline with timezone, within the next year.
    confirm:
      selector:
        boolean: {}
      required: true
    expected_access_revision:
      selector:
        number:
          min: 0
          mode: box
    request_id:
      selector:
        text: {}
revoke_access_grant:
  name: Revoke SimpliFi access
  description: Administrator only. Immediately removes this integration grant; leaves
    the HA account active.
  fields:
    entry_id:
      selector:
        text: {}
      required: true
    user_id:
      selector:
        text: {}
      required: true
    confirm:
      selector:
        boolean: {}
      required: true
    expected_access_revision:
      selector:
        number:
          min: 0
          mode: box
    request_id:
      selector:
        text: {}

preview_setup:
  name: Review guided household setup
  description: Administrator-only review of a person, device assignments and optional internet schedules. No gateway writes.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    configuration:
      required: true
      selector:
        object: {}
apply_setup:
  name: Apply reviewed household setup
  description: Administrator only. Atomically saves a reviewed person, assignments and optional schedules; normal reconciliation applies current intent.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    configuration:
      required: true
      selector:
        object: {}
    preview_hash:
      required: true
      selector:
        text: {}
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    confirm:
      required: true
      selector:
        boolean: {}
    request_id:
      selector:
        text: {}
update_status:
  name: SimpliFi update information
  description: Administrator-only installed version and HACS handoff. Does not check remote releases or modify configuration.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
check_updates:
  name: SimpliFi update information (compatibility)
  description: Returns the installed version and HACS handoff. Check for new releases in HACS.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
preview_update:
  name: Legacy update preview (disabled)
  description: Compatibility action. Always refuses; use HACS to manage SimpliFi releases.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
install_update:
  name: Legacy update installation (disabled)
  description: Compatibility action. Always refuses; use HACS to install SimpliFi releases.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    expected_update_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    preview_hash:
      required: true
      selector:
        text: {}
    request_id:
      required: true
      selector:
        text: {}
    confirm:
      required: true
      selector:
        boolean: {}
set_update_schedule:
  name: Legacy update schedule (disabled)
  description: Compatibility action. Always refuses; configure update preferences in Home Assistant or HACS.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    expected_update_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    enabled:
      required: true
      selector:
        boolean: {}
    days:
      required: true
      description: Integer weekdays, Monday 0 through Sunday 6.
      selector:
        object: {}
    time:
      required: true
      description: Household-local HH:MM.
      selector:
        text: {}
    confirm:
      required: true
      selector:
        boolean: {}
recover_update:
  name: Legacy update recovery (disabled)
  description: Compatibility action. Always refuses; an interrupted previous installer must be resolved before migration.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    expected_update_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    confirm:
      required: true
      selector:
        boolean: {}

unblock_group:
  name: Unblock group rules
  description: Lift group-assigned rules of any kind, preserving other groups, whole-network rules and existing
    suspensions. Default timing captures active rules to their individual ends; explicit timing captures every enabled
    assigned rule. Authenticated administrator or explicitly scoped account. Saved intent and gateway confirmation
    are separate.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    group_id:
      required: true
      selector:
        text: {}
    duration_minutes:
      required: false
      selector:
        number:
          min: 1
          max: 10080
          mode: box
    expires_at:
      required: false
      selector:
        text: {}
    next_window_end:
      required: false
      selector:
        boolean: {}
    indefinite:
      required: false
      selector:
        boolean: {}
    expected_revision:
      selector:
        number:
          min: 0
          mode: box
    request_id:
      selector:
        text: {}
    reason:
      selector:
        text: {}
end_group_unblock:
  name: End group rule allowances
  description: End all allowances on this group’s rules; keep its pauses and suspensions. Authenticated administrator
    or explicitly scoped account. Saved intent and gateway confirmation are separate.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    group_id:
      required: true
      selector:
        text: {}
    expected_revision:
      selector:
        number:
          min: 0
          mode: box
    request_id:
      selector:
        text: {}
    reason:
      selector:
        text: {}
extend_group_unblock:
  name: Extend group rule allowances
  description: 'Give every active finite group allowance the same deadline: the latest current end plus these minutes.
    Indefinite allowances are unchanged. Authenticated administrator or explicitly scoped account. Saved intent
    and gateway confirmation are separate.'
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    group_id:
      required: true
      selector:
        text: {}
    duration_minutes:
      required: true
      selector:
        number:
          min: 1
          max: 10080
          mode: box
    expected_revision:
      selector:
        number:
          min: 0
          mode: box
    request_id:
      selector:
        text: {}
    reason:
      selector:
        text: {}
