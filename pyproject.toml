[project]
name = "simplifi-ha"
version = "0.18.0b1"
description = "Family internet controls for UniFi, made effortless via Home Assistant."
requires-python = ">=3.14"
license = "MIT"
dependencies = ["aiohttp>=3.14,<4", "probatio>=0.11.4", "dnspython==2.9.0"]

[project.optional-dependencies]
dev = ["aiounifi==96", "pytest>=9", "pytest-asyncio>=1", "ruff>=0.17", "mypy>=2", "PyYAML>=6", "jsonschema>=4", "pytest-homeassistant-custom-component==0.13.372", "homeassistant==2026.10.1"]

[tool.pytest.ini_options]
testpaths = ["tests/family_network"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/family_network/models.py", "custom_components/family_network/schedule.py", "custom_components/family_network/planner.py", "custom_components/family_network/reconciler.py", "custom_components/family_network/engine.py"]
check_untyped_defs = true
ignore_missing_imports = true
